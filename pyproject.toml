[project]
name = "assignmentvibe"
version = "0.1.0"
description = "PDF lecture script + assignment sheet -> a targeted LLM prompt, for use from the Linux desktop (Omarchy)."
requires-python = ">=3.10"
dependencies = [
    "pymupdf==1.28.2",
]

[project.optional-dependencies]
ocr = ["pytesseract", "pillow"]

[project.scripts]
assignmentvibe = "assignmentvibe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assignmentvibe*"]
